<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Shotbase Update Service</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(34rem, calc(100% - 3rem)); }
    h1 { margin-bottom: .5rem; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    p { line-height: 1.6; color: color-mix(in srgb, CanvasText 72%, transparent); }
    a { color: LinkText; }
  </style>
</head>
<body>
  <main>
    <h1>Shotbase Update Service</h1>
    <p>This domain securely delivers signed software updates for the Shotbase macOS application.</p>
    <p><a href="https://shotbase.com">Visit Shotbase</a></p>
  </main>
</body>
</html>
